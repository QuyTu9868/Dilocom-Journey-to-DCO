# Mỗi lần push lên nhánh main: đóng gói game và đẩy lên itch.io bằng butler
name: Deploy to itch.io

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # cho phép bấm chạy tay trong tab Actions

env:
  ITCH_TARGET: quytu9868/dlicom-journey-to-dco:html5   # tên-tài-khoản/đường-dẫn-game:kênh, đổi nếu URL game khác

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Chuẩn bị thư mục game (chỉ file cần để chơi)
        run: |
          mkdir dist
          cp -r index.html lib src assets dist/
          find dist -type d -name v2_src -prune -exec rm -rf {} +
          find dist \( -name "*.md" -o -name "*.txt" -o -name "*_sheet*" \) -delete

      - name: Cài butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler

      - name: Đẩy lên itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: ./butler push dist "$ITCH_TARGET"
